<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr.Kohler</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter+Tight:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e0f9;--header:#f7ecef;--card:#f7ecef;--ink:#1e1e22;--blue:#2255ff;--grid:rgba(200,120,200,.22)}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;min-height:100vh}
header{position:sticky;top:0;z-index:20;height:100px;background:var(--header);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(220,120,170,.35)}
.logo{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:44px;letter-spacing:-.5px;background:none;border:0;cursor:pointer;color:var(--ink)}
.burger{position:absolute;left:28px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;width:42px;height:34px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0}
.burger span{display:block;height:3px;background:var(--ink);border-radius:2px}
h1,h2{font-family:'Inter Tight',system-ui,sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.95;text-align:center}
.hero{min-height:calc(100vh - 100px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 20px 80px}
.hero h1{font-size:clamp(40px,6.2vw,84px);max-width:1200px}
.btn{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:500;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:16px 32px;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
main{max-width:1240px;margin:0 auto;padding:60px 24px 100px}
.q{font-size:clamp(34px,5vw,64px);margin-bottom:36px}
.classes{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-bottom:56px}
.classes button{flex:1 1 220px;max-width:360px;background:var(--card);color:var(--ink);border:0;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;font-size:28px;padding:34px 10px;border-radius:30px;box-shadow:0 12px 30px -8px rgba(220,120,170,.4);transition:transform .15s}
.classes button:hover{transform:translateY(-3px)}
.classes button.on{background:var(--blue);color:#fff}
.list{max-width:860px;margin:36px auto 0;display:grid;gap:14px}
.theme{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;margin:24px 0 2px}
.chap{display:flex;align-items:center;gap:18px;background:var(--card);padding:20px 26px;border-radius:22px;border:0;text-align:left;width:100%;cursor:pointer;color:var(--ink);font-family:'DM Sans',sans-serif;box-shadow:0 8px 22px -8px rgba(220,120,170,.4);transition:transform .15s}
.chap:hover{transform:translateX(6px)}
.chap .n{flex:none;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.chap b{font-size:20px;display:block}
.chap small{display:block;color:#555;font-size:15px;margin-top:2px}
.chap .arr{margin-left:auto;font-size:24px;color:var(--blue)}
.course{max-width:820px;margin:0 auto;background:rgba(247,236,239,.93);border-radius:30px;padding:48px 52px;box-shadow:0 16px 40px -12px rgba(220,120,170,.45)}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:500;margin-bottom:18px}
.course h1{text-align:left;font-size:clamp(30px,4.2vw,50px);margin-bottom:26px;line-height:1.02}
.course h3{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.02em;margin:30px 0 10px}
.course p,.course li{font-size:18px;line-height:1.65}
.course ul{padding-left:24px;margin:8px 0}
.def{background:#fff;border-left:5px solid var(--blue);border-radius:12px;padding:16px 20px;margin:18px 0;font-size:18px;line-height:1.6}
.def b{color:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.link{background:none;border:0;cursor:pointer;color:var(--blue);font-family:'DM Sans',sans-serif;font-weight:700;font-size:17px;padding:0}
.back{color:var(--ink);font-weight:500;margin-bottom:20px;display:inline-block}
.note{margin-top:30px;font-size:14px;color:#777;font-style:italic}
.drawer{position:fixed;inset:0;z-index:30;display:none}
.drawer.open{display:block}
.shade{position:absolute;inset:0;background:rgba(30,30,34,.35)}
.drawer nav{position:absolute;left:0;top:0;bottom:0;width:min(320px,85vw);background:var(--header);padding:110px 28px 28px;display:flex;flex-direction:column;gap:6px;box-shadow:12px 0 40px rgba(0,0,0,.15)}
.drawer nav button{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:28px;color:var(--ink);background:none;border:0;text-align:left;cursor:pointer;padding:10px 0;letter-spacing:-.02em}
.drawer nav button:hover{color:var(--blue)}
@media(max-width:700px){header{height:80px}.logo{font-size:32px}.burger{left:16px}.course{padding:30px 22px}.classes{gap:16px}}
</style>
</head>
<body>
<header>
  <button class="burger" data-go="accueil" id="burger" aria-label="Menu" data-menu="1"><span></span><span></span><span></span></button>
  <button class="logo" data-go="accueil">Mr.Kohler</button>
</header>
<div class="drawer" id="drawer">
  <div class="shade" data-close="1"></div>
  <nav>
    <button data-go="accueil">Accueil</button>
    <button data-go="classe">Choisir ma classe</button>
    <button data-go="prog:seconde">Seconde</button>
    <button data-go="prog:premiere">Première</button>
    <button data-go="prog:terminale">Terminale</button>
  </nav>
</div>
<div id="app"></div>

/* ===================== RENDU ===================== */
const app = document.getElementById('app');
const drawer = document.getElementById('drawer');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function contenu(ch){
  if(ch.html) return ch.html;
  let h = '';
  (ch.s||[]).forEach((sec,k)=>{
    h += `<h3>${k+1}. ${sec[0]}</h3>`;
    h += Array.isArray(sec[1]) ? `<ul>${sec[1].map(x=>`<li>${x}</li>`).join('')}</ul>` : `<p>${sec[1]}</p>`;
    if(k===0 && ch.d) h += `<div class="def">${ch.d}</div>`;
  });
  return h;
}

function classButtons(active){
  return `<div class="classes">${Object.entries(CLASSES).map(([id,c])=>
    `<button data-go="prog:${id}" class="${id===active?'on':''}">${c.nom}</button>`).join('')}</div>`;
}

function accueil(){
  app.innerHTML = `<section class="hero"><h1>Apprenez de la bonne manière,<br>apprenez avec Kohler.</h1>
  <button class="btn" data-go="classe">Commencer</button></section>`;
}

function classe(id){
  const c = CLASSES[id];
  let h = `<main><h2 class="q">En quelle classe est-tu ?</h2>${classButtons(id)}<h2 class="q">Quel cours souhaites-tu réviser ?</h2>`;
  if(c){
    h += `<div class="list">`;
    c.themes.forEach((th,i)=>{
      h += `<div class="theme">${esc(th.t)}</div>`;
      th.chapitres.forEach((ch,j)=>{
        h += `<button class="chap" data-go="cours:${id}:${i}:${j}"><span class="n">${j+1}</span>
          <span><b>${esc(ch.titre)}</b><small>${esc(ch.resume||'')}</small></span><span class="arr">→</span></button>`;
      });
    });
    h += `</div>`;
  }
  app.innerHTML = h + `</main>`;
}

function cours(id,i,j){
  const c = CLASSES[id], th = c.themes[i], ch = th.chapitres[j];
  const flat = []; c.themes.forEach((t,a)=>t.chapitres.forEach((_,b)=>flat.push([a,b])));
  const k = flat.findIndex(p=>p[0]==i&&p[1]==j);
  const lk = (p,l)=> p ? `<button class="link" data-go="cours:${id}:${p[0]}:${p[1]}">${l}</button>` : '<span></span>';
  app.innerHTML = `<main><button class="link back" data-go="prog:${id}">← Retour au programme de ${c.nom}</button>
  <article class="course"><span class="tag">${c.nom} · ${esc(th.t)}</span><h1>${esc(ch.titre)}</h1>
  ${contenu(ch)}
  <div class="nav">${lk(flat[k-1],'← Chapitre précédent')}${lk(flat[k+1],'Chapitre suivant →')}</div>
  <p class="note">Contenu de base à compléter par le cours de M. Kohler.</p></article></main>`;
}

function go(route){
  const [page,a,b,c] = route.split(':');
  drawer.classList.remove('open');
  window.scrollTo(0,0);
  if(page==='classe') classe();
  else if(page==='prog') classe(a);
  else if(page==='cours') cours(a,+b,+c);
  else accueil();
}

/* un seul écouteur de clic : fiable partout (pas de dépendance à l'URL) */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-menu]')){ drawer.classList.toggle('open'); return; }
  if(e.target.closest('[data-close]')){ drawer.classList.remove('open'); return; }
  const el = e.target.closest('[data-go]');
  if(el) go(el.dataset.go);
});

go('accueil');
</script>
</body>
</html>
